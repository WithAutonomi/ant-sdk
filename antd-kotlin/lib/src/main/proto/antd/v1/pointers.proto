syntax = "proto3";

package antd.v1;

option csharp_namespace = "Antd.V1";
option go_package = "github.com/WithAutonomi/ant-sdk/antd-go/proto/antd/v1;v1";

import "antd/v1/common.proto";

// Pointers: owner-signed, paid, mutable references (ADR-0016 in ant-node),
// with ownership transfer by final redirection (ADR-0018). Mirrors the REST
// `/v1/pointers` surface 1:1.
//
// antd signs with owner keys it loaded at startup (`--pointer-keys`). A write
// names the pointer by its address (`owner`), never by a key; `ListKeys`
// lists the pointers this daemon can write.
//
// Addresses, state ids and targets are 64 hex characters. Counters are
// decimal strings: a final state sits at u64::MAX.
//
// Every write pays, and every attempt pays again. Do not retry Create,
// Update or Transfer automatically; a Finalize that fails with
// `CLOSE_GROUP_SHORTFALL` is retried by repeating it with the same
// `upload_id`, which reuses the payment.
service PointerService {
  rpc ListKeys(ListPointerKeysRequest) returns (ListPointerKeysResponse);

  // Create a pointer with the daemon wallet. ALREADY_EXISTS if it exists.
  rpc Create(PointerWriteRequest) returns (PointerWriteResponse);
  // Point a pointer at a new target with the daemon wallet, creating it if
  // it does not exist. FAILED_PRECONDITION if the pointer is final.
  rpc Update(PointerWriteRequest) returns (PointerWriteResponse);
  // Hand a pointer over to the recipient's pointer for good, with the daemon
  // wallet. Irreversible once stored.
  rpc Transfer(PointerTransferRequest) returns (PointerTransferResponse);

  rpc Get(GetPointerRequest) returns (PointerRecord);
  // Follow a chain of pointers to the target at its end.
  rpc Resolve(ResolvePointerRequest) returns (PointerResolved);
  // Ask the whole close group whether a pointer is final, and on what.
  rpc Finality(PointerFinalityRequest) returns (PointerFinality);
  // Follow a pointer's transfers to the pointer whose owner now decides.
  rpc Controller(PointerControllerRequest) returns (PointerController);

  // External signer: sign a write with a loaded key and quote it. Mirrors
  // REST `/v1/pointers/prepare`; the payment shape is ChunkService's.
  rpc Prepare(PreparePointerRequest) returns (PreparePointerResponse);
  // External signer: store the prepared write once it is paid.
  rpc Finalize(FinalizePointerRequest) returns (FinalizePointerResponse);
}

message ListPointerKeysRequest {}

message ListPointerKeysResponse {
  // The pointers this daemon holds owner keys for.
  repeated PointerKey keys = 1;
}

message PointerKey {
  // The pointer's address, derived from the owner key.
  string address = 1;
}

message PointerWriteRequest {
  // Address of the pointer to write.
  string owner = 1;
  // Address to point at.
  string target = 2;
  // "chunk" (default when empty) or "pointer".
  string kind = 3;
}

message PointerWriteResponse {
  string address = 1;
  string state_id = 2;
  string counter = 3;
}

message PointerTransferRequest {
  string owner = 1;
  // Address of the recipient's pointer, which must already exist.
  string recipient = 2;
}

message PointerTransferResponse {
  string address = 1;
  string state_id = 2;
  // The close group's view once the write landed. Unset when that check
  // failed, which does not undo the transfer; see `finality_error`.
  PointerFinality finality = 3;
  string finality_error = 4;
}

message GetPointerRequest {
  string address = 1;
}

message PointerRecord {
  string address = 1;
  // Owner's ML-DSA-65 public key (hex, 1,952 bytes).
  string owner = 2;
  string counter = 3;
  // "chunk", "pointer", or "unknown"; `kind_tag` is the raw value.
  string kind = 4;
  uint32 kind_tag = 5;
  string target = 6;
  string state_id = 7;
  // At the final counter: nothing can replace this state.
  bool is_final = 8;
  // Set when the final state hands the pointer over to another.
  string transferred_to = 9;
}

message ResolvePointerRequest {
  string address = 1;
}

message PointerResolved {
  string kind = 1;
  uint32 kind_tag = 2;
  string target = 3;
}

message PointerFinalityRequest {
  string address = 1;
}

message PointerFinalState {
  string state_id = 1;
  string kind = 2;
  uint32 kind_tag = 3;
  string target = 4;
  // How many peers of the close group hold it.
  uint32 holders = 5;
  string transferred_to = 6;
}

message PointerFinality {
  string address = 1;
  uint32 group = 2;
  uint32 answered = 3;
  // "open", "settling", "unconfirmed", "final" or "forked". Only "final"
  // means one final state, held by a majority, with no rival seen.
  string status = 4;
  // open: the counter a read would return; empty if none is corroborated.
  string counter = 5;
  // settling / unconfirmed / final: the one final state seen.
  PointerFinalState state = 6;
  // forked: every final state seen, most-held first.
  repeated PointerFinalState states = 7;
  // forked: the state a majority holds, which reads return.
  PointerFinalState majority = 8;
  // Set once the pointer is beyond dispute handed over (status "final").
  string transferred_to = 9;
}

message PointerControllerRequest {
  string address = 1;
}

message PointerController {
  string pointer = 1;
  repeated string transfers = 2;
  bool frozen = 3;
}

message PreparePointerRequest {
  string owner = 1;
  // "create", "update" or "transfer".
  string op = 2;
  // create / update.
  string target = 3;
  string kind = 4;
  // transfer.
  string recipient = 5;
  bool include_signed_quotes = 6;
}

message PreparePointerResponse {
  string upload_id = 1;
  string op = 2;
  string address = 3;
  string state_id = 4;
  string counter = 5;
  // Always "wave_batch".
  string payment_type = 6;
  repeated PaymentEntry payments = 7;
  string total_amount = 8;
  string payment_vault_address = 9;
  string payment_token_address = 10;
  string rpc_url = 11;
  repeated SignedQuoteEntry signed_quotes = 12;
}

message FinalizePointerRequest {
  string upload_id = 1;
  // quote_hash (hex) → tx_hash (hex). Ignored when repeating a finalize
  // that failed after payment.
  map<string, string> tx_hashes = 2;
}

message FinalizePointerResponse {
  string address = 1;
  string state_id = 2;
  string counter = 3;
  // transfer only.
  PointerFinality finality = 4;
}
