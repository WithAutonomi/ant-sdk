[package]
name = "antd"
version = "0.12.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
ant-core = { git = "https://github.com/WithAutonomi/ant-client", tag = "ant-cli-v0.3.5" }  # ant-core 0.8.0 release; NetworkHealth helper (V2-1037) + ant-protocol 2.3.4 line. Lock pins saorsa-core 0.27.3: the FIRST release containing the runtime re-bootstrap recovery (V2-1036, saorsa-core#153) that /health's write_ready semantics depend on — 0.27.2 predates it despite its tag date (was 0.6.0 / ant-cli-v0.3.3)
self_encryption = "0.36.0"
evmlib = "0.9.1" # must track ant-core's transitive evmlib (via ant-protocol) to avoid a second copy in the graph
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bytes = "1"
base64 = "0.22"
blake3 = "1"
rmp-serde = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
futures = "0.3"
rand = "0.8"
postcard = { version = "1.1.3", features = ["use-std"] }
toml = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
tonic-build = "0.12"
