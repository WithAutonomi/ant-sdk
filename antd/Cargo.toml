[package]
name = "antd"
version = "0.16.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
ant-core = { git = "https://github.com/WithAutonomi/ant-client", rev = "2eace7374d0642376e799458a4fb9e63c2b7cc4c" }  # DEV PIN, DO NOT MERGE: WithAutonomi/ant-client#229 (V2-1564, SHA-256 of uploads + manifest entries) on top of main 225a676 (= the 2026-10-15 train content). Repin to the first ant-core release that ships #229 before merge.
self_encryption = "0.36.0"
evmlib = "0.10.0" # must track ant-core's transitive evmlib (via ant-protocol) to avoid a second copy in the graph
ant-protocol = "=4.0.0" # resolved through the [patch.crates-io] below to the revision ant-client main pins; any other source would fork PaymentQuote/StorageCommitment in the graph
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bytes = "1"
base64 = "0.22"
blake3 = "1"
rmp-serde = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
futures = "0.3"
rand = "0.8"
postcard = { version = "1.1.3", features = ["use-std"] }
toml = "0.8"
zeroize = "1" # pointer owner key seeds are wiped after the key pair is derived

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
xor_name = "5"
tempfile = "3"

[build-dependencies]
tonic-build = "0.12"

# DEV PIN, DO NOT MERGE: ant-client main resolves ant-protocol 4.0.0 to this
# revision through its own workspace patch (ADR-0018 final pointer states);
# a dependency's patches do not reach antd, so mirror it here. Drop with the
# ant-core repin.
[patch.crates-io]
ant-protocol = { git = "https://github.com/WithAutonomi/ant-protocol", rev = "718f60682bb3704b68fbba0bea34f2a0416fa876" }
