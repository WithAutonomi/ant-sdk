[package]
name = "antd"
version = "0.13.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
ant-core = { git = "https://github.com/WithAutonomi/ant-client", tag = "ant-cli-v0.3.8" }  # ant-core 0.10.0 release (2026-09-15): bootstrap_peers.toml moved to ant-core/resources and became `quic`/`webrtc` multiaddr arrays (ADR-0005); the loader reads both that and the legacy `peers = ["ip:port"]` shape. Also ant-protocol 3.0.0 / evmlib 0.10.0 / saorsa-core 0.28.0 / saorsa-transport 0.37.0. Previous pin ant-cli-v0.3.5 (ant-core 0.8.0) could not parse the new file and silently fell back to the compiled-in list.
self_encryption = "0.36.0"
evmlib = "0.10.0" # must track ant-core's transitive evmlib (via ant-protocol) to avoid a second copy in the graph
ant-protocol = "=3.0.0" # pinned exactly to ant-core's transitive ant-protocol (ant-cli-v0.3.8 / ant-core 0.10.0 line; was =2.3.4 on 0.8.0) — a different version would fork PaymentQuote/StorageCommitment in the graph
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bytes = "1"
base64 = "0.22"
blake3 = "1"
rmp-serde = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
futures = "0.3"
rand = "0.8"
postcard = { version = "1.1.3", features = ["use-std"] }
toml = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
xor_name = "5"

[build-dependencies]
tonic-build = "0.12"

# Release profile tuned for binary size. Measured on antd (2026-06-09):
# Linux 36.5 MB -> 22.1 MB (-37%), Windows .exe 29.8 MB -> 24.6 MB (-17%).
# `strip` alone is the big, free win on Linux (debug symbols the .exe never
# needed); thin LTO + a single codegen unit add the rest and tend to improve
# runtime perf, at the cost of a slower release link (does not affect dev /
# `cargo build`). Both variants smoke-tested (launch + /health) on Linux and
# Windows.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
