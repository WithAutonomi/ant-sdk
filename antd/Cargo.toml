[package]
name = "antd"
version = "0.17.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
ant-core = { git = "https://github.com/WithAutonomi/ant-client", tag = "ant-cli-v0.3.12" }  # ant-core 0.14.0 release (2026-10-23): SHA-256 of uploads and on manifest entries (ant-client#229, V2-1564) + hot-record read spreading (ADR-0023, ant-client#225) + rustls 0.23.46; ant-protocol 5.0.1 / evmlib 0.10.0 / saorsa-core 0.29.2 / saorsa-transport 0.38.2; devnets pair it with ant-node 0.23.1. Previous pin ant-cli-v0.3.11 (ant-core 0.13.0). Must stay at ant-cli-v0.3.8 or later, the first release to read the ADR-0005 bootstrap_peers.toml shape (`quic`/`webrtc` multiaddr arrays); older pins silently fell back to the compiled-in list.
self_encryption = "0.36.0"
evmlib = "0.10.0" # must track ant-core's transitive evmlib (via ant-protocol) to avoid a second copy in the graph
ant-protocol = "=5.0.1" # pinned exactly to ant-core's transitive ant-protocol (ant-cli-v0.3.12 / ant-core 0.14.0 line; was =5.0.0 on 0.13.0) — a different version would fork PaymentQuote/StorageCommitment in the graph
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bytes = "1"
base64 = "0.22"
blake3 = "1"
rmp-serde = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
futures = "0.3"
rand = "0.8"
postcard = { version = "1.1.3", features = ["use-std"] }
toml = "0.8"
zeroize = "1" # pointer owner key seeds are wiped after the key pair is derived

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
xor_name = "5"
tempfile = "3"

[build-dependencies]
tonic-build = "0.12"

# Release profile tuned for binary size. Measured on antd (2026-06-09):
# Linux 36.5 MB -> 22.1 MB (-37%), Windows .exe 29.8 MB -> 24.6 MB (-17%).
# `strip` alone is the big, free win on Linux (debug symbols the .exe never
# needed); thin LTO + a single codegen unit add the rest and tend to improve
# runtime perf, at the cost of a slower release link (does not affect dev /
# `cargo build`). Both variants smoke-tested (launch + /health) on Linux and
# Windows.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
