[package]
name = "antd"
version = "0.15.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
ant-core = { git = "https://github.com/WithAutonomi/ant-client", tag = "ant-cli-v0.3.11-rc.1" }  # ant-core 0.13.0-rc.1 (2026-10-15 train, rc-2026.10.2): pointer ownership transfer (ADR-0018) + single-flight chunk fetches (ant-client#218); ant-protocol 5.0.0-rc.1 / evmlib 0.10.0; devnets pair it with ant-node 0.23.0-rc.1. RC PIN: move to the final ant-cli-v0.3.11 tag (and ant-protocol to its published release) before merge. Previous pin ant-cli-v0.3.10 (ant-core 0.12.0). Must stay at ant-cli-v0.3.8 or later, the first release to read the ADR-0005 bootstrap_peers.toml shape (`quic`/`webrtc` multiaddr arrays); older pins silently fell back to the compiled-in list.
self_encryption = "0.36.0"
evmlib = "0.10.0" # must track ant-core's transitive evmlib (via ant-protocol) to avoid a second copy in the graph
ant-protocol = { git = "https://github.com/WithAutonomi/ant-protocol", branch = "rc-2026.10.2" } # must be the exact source spec ant-core uses (ant-cli-v0.3.11-rc.1 pins this branch; was =4.0.0 on ant-cli-v0.3.10) — any other version or git reference would fork PaymentQuote/StorageCommitment in the graph
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bytes = "1"
base64 = "0.22"
blake3 = "1"
rmp-serde = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
futures = "0.3"
rand = "0.8"
postcard = { version = "1.1.3", features = ["use-std"] }
toml = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
xor_name = "5"

[build-dependencies]
tonic-build = "0.12"
