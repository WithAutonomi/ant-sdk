# osv-scanner configuration for .github/workflows/security-audit.yml.
#
# Every entry is a reasoned, time-boxed ignore. Do not add one without:
#   - why the finding is acceptable (unreachable, no fix exists, ...),
#   - where removal is tracked (Linear issue or upstream PR), and
#   - an ignoreUntil date. When the date passes the finding is reported
#     again and the audit fails, which forces a re-review.
#
# Rust ignores here must agree with the cargo-audit ignores in
# antd/, ffi/rust/ and ffi/node/ .cargo/audit.toml.

# --- zip 2.4.2 (transitive: ant-core -> zip) --------------------------------
# All three affect only ZipArchive::extract() / ZipStreamReader::extract().
# ant-core's node::binary::extract_zip walks entries with by_index and copies
# one named file itself; it never calls extract(), and the SDKs never call
# ant_core::node at all. Same reasoning and date as the cargo-audit ignores
# from #372. Remove when ant-core is repinned to a release with zip >= 9
# (V2-1634; upstream ant-client#233 / V2-1632).

[[IgnoredVulns]]
id = "RUSTSEC-2026-0367"
ignoreUntil = 2026-11-16
reason = "zip extract() SUID/SGID preservation; ant-core never calls extract(). V2-1634."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0368"
ignoreUntil = 2026-11-16
reason = "zip extract() symlink escape; ant-core never calls extract(). V2-1634."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0369"
ignoreUntil = 2026-11-16
reason = "zip extract() permissions through symlinks; ant-core never calls extract(). V2-1634."

# --- lru 0.16 (transitive: evmlib -> alloy -> alloy-provider -> lru) --------
# Unsound LruCache::pop() under a panicking closure. The fix is lru 0.18, a
# semver-major bump that has to come from alloy-provider upstream.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0253"
ignoreUntil = 2027-01-18
reason = "lru 0.16 unsound pop(); fix needs lru 0.18 via an alloy-provider upgrade upstream. V2-1582."

