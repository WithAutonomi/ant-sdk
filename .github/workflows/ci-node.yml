# Build + test the ffi/node napi-rs addon.
#
# Two jobs:
#   • test  — native build + offline smoke tests on Linux/macOS/Windows. This is
#             the fast signal that the addon loads and works on each OS.
#   • build — the full cross-compile platform matrix (8 targets), proving each
#             prebuilt `.node` compiles and packages. napi's recommended flow:
#               linux-gnu  -> --use-napi-cross (portable old-glibc sysroot, no Docker)
#               linux-musl -> Zig + cargo-zigbuild (-x)
#               macOS/Win  -> native runners (arm64 host cross-builds the x64 slice)
#
# `fail-fast: false` so every target's result is visible in one run. musl and
# the cross targets are the ones most likely to need iteration on first run —
# they compile the full ant-core native tree (QUIC/libp2p/rustls/evmlib).

name: CI (node ffi)

on:
  push:
    branches: [main]
    paths:
      - "ffi/node/**"
      - "ffi/rust/**"
      - ".github/workflows/ci-node.yml"
  pull_request:
    paths:
      - "ffi/node/**"
      - "ffi/rust/**"
      - ".github/workflows/ci-node.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-node-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: ffi/node

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ffi/node/target/
          key: test-${{ matrix.os }}-cargo-${{ hashFiles('ffi/node/Cargo.lock') }}
      - run: npm ci
      - name: Build (native, debug)
        run: npx napi build --platform
      - name: Offline smoke tests
        run: npm test

  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            host: macos-latest
          - target: aarch64-apple-darwin
            host: macos-latest
          - target: x86_64-pc-windows-msvc
            host: windows-latest
          - target: aarch64-pc-windows-msvc
            host: windows-latest
          - target: x86_64-unknown-linux-gnu
            host: ubuntu-latest
            build_args: --use-napi-cross
          - target: aarch64-unknown-linux-gnu
            host: ubuntu-latest
            build_args: --use-napi-cross
          - target: x86_64-unknown-linux-musl
            host: ubuntu-latest
            zig: true
            build_args: -x
          - target: aarch64-unknown-linux-musl
            host: ubuntu-latest
            zig: true
            build_args: -x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Set up Zig (musl cross)
        if: ${{ matrix.zig }}
        uses: mlugg/setup-zig@v1
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild (musl cross)
        if: ${{ matrix.zig }}
        run: cargo install cargo-zigbuild --locked
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ffi/node/target/
          key: build-${{ matrix.target }}-cargo-${{ hashFiles('ffi/node/Cargo.lock') }}
      - run: npm ci
      - name: Build ${{ matrix.target }}
        run: npx napi build --platform --release --target ${{ matrix.target }} ${{ matrix.build_args }}
      - name: Show artifact
        run: ls -la *.node
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: ffi/node/*.node
          if-no-files-found: error
