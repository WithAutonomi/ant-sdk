name: Publish antd-dart (antd_client on pub.dev)

# Publishes the `antd_client` package (antd-dart/) to pub.dev via pub.dev
# Automated Publishing (GitHub OIDC) — no long-lived pub.dev credential.
#
# Real publishing happens ONLY on a `dart-v<version>` tag push, and only after
# the tag is verified to match pubspec.yaml. A manual run (workflow_dispatch)
# never publishes: it is the same analyze + test + `dart pub publish --dry-run`
# pass, for checking a branch before tagging.
#
# ── One-time setup (see Linear V2-1312) ──
#   1. pub.dev has no pending-publisher concept: the FIRST version is uploaded
#      by a human (`dart pub login` as the team Google account, then
#      `dart pub publish` from a clean checkout of the release tag).
#   2. On pub.dev, package antd_client > Admin: transfer to the verified
#      publisher `autonomi.com`, then enable Automated publishing from
#      GitHub Actions: repository WithAutonomi/ant-sdk, tag pattern
#      `dart-v{{version}}`, and require the GitHub Actions environment
#      `pub-dev`. From then on every `dart-v*` tag publishes through this file.
#   3. GitHub environment `pub-dev`: required reviewers + tag rule `dart-v*`.
#      Only the `publish` job references the environment, so verify-only runs
#      never touch it.
#
# ── How to run ──
#   • Push a tag `dart-v<version>` (e.g. dart-v0.1.1) -> verify, then publish
#     (pauses for environment approval).
#   • Or run manually (Actions > Run workflow) -> verify + dry-run only.

on:
  workflow_dispatch:
  push:
    tags:
      - "dart-v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (analyze, test, dry-run)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: antd-dart
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Check tag matches pubspec version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/dart-v')
        run: |
          expected="${GITHUB_REF#refs/tags/dart-v}"
          actual="$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '[:space:]')"
          if [ "$expected" != "$actual" ]; then
            echo "tag version '$expected' != pubspec.yaml version '$actual'" >&2
            exit 1
          fi
          echo "version $actual matches tag"

      - name: dart pub get
        run: dart pub get

      - name: dart analyze
        run: dart analyze --fatal-infos

      - name: dart test
        run: dart test

      - name: dart pub publish --dry-run
        run: dart pub publish --dry-run

  publish:
    name: Publish to pub.dev
    needs: verify
    # Tag PUSH only. The event check is explicit (not just the ref prefix) so a
    # workflow_dispatch whose selected ref happens to be a dart-v* tag still
    # cannot reach this job.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/dart-v')
    runs-on: ubuntu-latest
    environment: pub-dev
    permissions:
      id-token: write   # OIDC token for pub.dev Automated Publishing
      contents: read
    defaults:
      run:
        working-directory: antd-dart
    steps:
      - uses: actions/checkout@v4

      # With `id-token: write`, setup-dart requests a GitHub OIDC token for the
      # pub.dev audience and registers it with `dart pub token add`, so the
      # publish step below needs no secret.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: dart pub get
        run: dart pub get

      - name: dart pub publish
        run: dart pub publish --force
