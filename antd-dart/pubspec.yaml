name: antd_client
description: Dart client for the antd daemon - REST and gRPC access to the Autonomi decentralized storage network (public and private data, chunks, files, external-signer uploads).
version: 0.2.0
homepage: https://autonomi.com
repository: https://github.com/WithAutonomi/ant-sdk/tree/main/antd-dart
issue_tracker: https://github.com/WithAutonomi/ant-sdk/issues
topics:
  - autonomi
  - antd
  - decentralized-storage
  - grpc

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  fixnum: ^1.1.0
  http: ^1.1.0
  grpc: ^4.0.1
  protobuf: ^4.1.0

dev_dependencies:
  lints: ^2.1.0
  test: ^1.24.0
  web3dart: ^2.7.0
